# For God so loved the world that he gave his only begotten Son,
#     that whoever believes in him should not perish but have eternal life.
#     John 3:16

[package]
name = "propagators-chirho"
version = "0.1.5"
edition = "2021"
rust-version = "1.70"
authors = ["loveJesus <loveJesus@loveJesus.software>"]
description = "A Rust implementation of propagator networks for constraint propagation and bidirectional computation"
documentation = "https://docs.rs/propagators-chirho"
readme = "README.md"
homepage = "https://github.com/loveJesus/propagators-chirho"
repository = "https://github.com/loveJesus/propagators-chirho"
license = "MIT"
keywords = ["propagators", "constraints", "interval-arithmetic", "csp", "bidirectional"]
categories = ["algorithms", "mathematics", "science"]
include = [
    "/src/**/*",
    "/examples/**/*",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[lib]
name = "propagators_chirho"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "temperature_chirho"
path = "examples/temperature_chirho.rs"

[[example]]
name = "pythagorean_chirho"
path = "examples/pythagorean_chirho.rs"

[[example]]
name = "sudoku_chirho"
path = "examples/sudoku_chirho.rs"

[[example]]
name = "electrical_chirho"
path = "examples/electrical_chirho.rs"

[[example]]
name = "scheduling_chirho"
path = "examples/scheduling_chirho.rs"

[dependencies]
# Optional: Arena allocation for high-performance mode
typed-arena = { version = "2.0", optional = true }
# Optional: Parallel propagation
rayon = { version = "1.10", optional = true }
# Optional: Serialization support
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# Optional: WebAssembly bindings
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
# Optional: Python bindings via PyO3
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"], optional = true }
# Optional: Tracing/logging for debugging (performance impact when enabled)
tracing = { version = "0.1", optional = true }
# Optional: Dependency-directed backtracking (memory overhead)
indexmap = { version = "2.0", optional = true }
# Required for no_std math operations (sqrt, powi, etc.)
libm = { version = "0.2", optional = true }
# Optional: Async runtime for network transports
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "sync", "macros", "time"], optional = true }
# Optional: WebSocket support
tokio-tungstenite = { version = "0.24", optional = true }
# Optional: Async utilities
futures = { version = "0.3", optional = true }
# Optional: URL parsing for WebSocket connections
url = { version = "2.5", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[features]
default = []
# Enable Kani verification proofs
kani = []
# High-performance arena-based cells (reduces Rc overhead)
arena = ["typed-arena"]
# Parallel propagation using rayon
parallel = ["rayon"]
# Serialization support via serde
serde = ["dep:serde", "dep:serde_json"]
# WebAssembly support
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# Python bindings via PyO3
python = ["dep:pyo3", "arena"]
# Tracing instrumentation for debugging propagation (adds overhead)
tracing = ["dep:tracing"]
# Truth Maintenance System with dependency tracking (memory overhead)
tms-full = []
# Dependency-directed backtracking (memory + CPU overhead)
backtrack = ["dep:indexmap", "tms-full"]
# no_std support (disables features requiring std)
no-std = ["dep:libm"]
# Distributed network support for multi-node propagation
network = ["serde"]
# WebSocket transport for distributed networks
network-websocket = ["network", "dep:tokio", "dep:tokio-tungstenite", "dep:futures", "dep:url"]
# Cloudflare Durable Objects integration
cloudflare = ["serde"]

[[bench]]
name = "propagator_bench_chirho"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[badges]
maintenance = { status = "actively-developed" }
