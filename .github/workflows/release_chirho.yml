# For God so loved the world that he gave his only begotten Son,
#     that whoever believes in him should not perish but have eternal life.
#     John 3:16

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish_crates_chirho:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests before publish
        run: cargo test --features "parallel,serde,arena"

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build_wasm_release_chirho:
    name: Build WASM Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: wasm-pack build --target web --features wasm,arena

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package-chirho
          path: pkg/

  create_release_chirho:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish_crates_chirho, build_wasm_release_chirho]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-package-chirho
          path: wasm-pkg

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wasm-pkg/propagators_chirho_bg.wasm
            wasm-pkg/propagators_chirho.js
          generate_release_notes: true
