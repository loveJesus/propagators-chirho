# For God so loved the world that he gave his only begotten Son,
#     that whoever believes in him should not perish but have eternal life.
#     John 3:16

name: CI

on:
  push:
    branches: [main_chirho]
  pull_request:
    branches: [main_chirho]

env:
  CARGO_TERM_COLOR: always

jobs:
  test_chirho:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (default features)
        run: cargo test --verbose

      - name: Run tests (parallel feature)
        run: cargo test --features parallel --verbose

      - name: Run tests (all features except python/wasm)
        run: cargo test --features "parallel,serde,arena,tracing,tms-full" --verbose

  serde_chirho:
    name: Serde Serialization Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run serde tests
        run: cargo test --features serde --verbose -- serde

      - name: Verify serialization roundtrip
        run: cargo test --features serde --verbose

  clippy_chirho:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --features "parallel,serde,arena" -- -D warnings

  fmt_chirho:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc_chirho:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --no-deps --features "parallel,serde,arena"
        env:
          RUSTDOCFLAGS: -D warnings

  no_std_chirho:
    name: no_std Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi

      - name: Build for bare-metal target
        run: cargo build --lib --target thumbv7m-none-eabi --features no-std

  examples_chirho:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run temperature example
        run: cargo run --example temperature_chirho

      - name: Run pythagorean example
        run: cargo run --example pythagorean_chirho

      - name: Run sudoku example
        run: cargo run --example sudoku_chirho

      - name: Run electrical example
        run: cargo run --example electrical_chirho

      - name: Run scheduling example
        run: cargo run --example scheduling_chirho
